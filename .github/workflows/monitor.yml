name: Monitor de Oportunidades

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

# Evita que execuções concorrentes (cron + disparo manual) tentem commitar
# e dar push no banco de dados ao mesmo tempo.
concurrency:
  group: monitor-oportunidades
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install chromium

      - name: Executar monitor de oportunidades
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py

      # Diagnóstico: só existe arquivo se scrapers/portais.py detectou
      # bloqueio/seletor não encontrado e salvou o HTML real recebido
      # (debug_<portal>_html.html). Permite inspecionar a estrutura real
      # da página sem precisar reproduzir o bloqueio manualmente.
      - name: Upload do HTML de diagnóstico (se capturado)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: debug_*_html.html
          if-no-files-found: ignore
          retention-days: 5

      - name: Persistir banco de dados (commit e push)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add imoveis.db
          if git diff --cached --quiet; then
            echo "Nenhuma alteração no banco de dados; nada a commitar."
          else
            git commit -m "chore: atualiza banco de dados de imóveis processados [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
