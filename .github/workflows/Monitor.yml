name: Monitor House Flipping Vitoria

on:
  schedule:
    - cron: '0 */3 * * *' # Executa a cada 3 horas
  workflow_dispatch: # Permite disparo manual pelo botão Run workflow

jobs:
  monitorar:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Executar rastreador
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Persistir histórico do banco de dados
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add database.db || true
          git commit -m "Auto: atualiza base de dados de imoveis" || true
          git push || true
